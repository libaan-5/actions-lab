name: Run Docker Image using GitHub Actions
run-name: ${{ github.actor }} is attempting to run the docker image.
on: 
    workflow_dispatch:
    push:
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Log into Docker Hub
        run: docker run -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image
        run: docker build -t hello-flask .
       
      - name: Tag docker image  
        run: docker tag hello-flask libaano/hello-flask-cd:latest
      
      - name: Push docker image to docker hub
        run: docker push libaano/hello-flask-cd:latest

    